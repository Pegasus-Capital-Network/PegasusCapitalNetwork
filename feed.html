<style>
/* ─── Feed layout ───────────────────────────────────────────────────────── */
.fd-shell{max-width:1120px;margin:0 auto;padding:var(--sp-lg) var(--sp-lg) var(--sp-3xl)}
.fd-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-lg);margin:var(--sp-xs) 0 var(--sp-md);flex-wrap:wrap}
.fd-head h1{font-family:var(--serif);font-weight:400;font-size:clamp(24px,2.6vw,32px);color:var(--text);margin:0;letter-spacing:-.015em}
.fd-head p{font-size:13px;color:var(--text3);margin:4px 0 0;max-width:640px;line-height:1.6}
.fd-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--sp-lg);align-items:start}
@media(max-width:980px){.fd-grid{grid-template-columns:minmax(0,1fr)}.fd-rail{order:1;min-width:0}}
.fd-rail>*{min-width:0;max-width:100%}
.fd-namerow{display:flex;gap:8px;margin-top:10px}
.fd-namerow .fd-in{flex:1;min-width:0}
@media(max-width:640px){.fd-head p,.fd-comp-sub,.fd-guest-s{display:none}.fd-guest-a{margin-left:0}}
.fd-main{display:flex;flex-direction:column;gap:var(--sp-md);min-width:0}
.fd-rail{display:flex;flex-direction:column;gap:var(--sp-md);position:sticky;top:84px}
@media(max-width:980px){.fd-rail{position:static}}

/* ─── Filters ───────────────────────────────────────────────────────────── */
.fd-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--sp-sm)}
.fd-pill{background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:11px;padding:5px 12px;border-radius:20px;cursor:pointer;transition:all var(--dur-fast);font-family:inherit}
.fd-pill:hover{border-color:var(--border2);color:var(--text)}
.fd-pill.on{background:var(--blue-dim);border-color:rgba(29,90,158,.30);color:var(--blue)}

/* ─── Cards ─────────────────────────────────────────────────────────────── */
.fd-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r3);box-shadow:var(--sh-card)}
.fd-card-b{padding:16px 18px}
.fd-av{width:42px;height:42px;border-radius:50%;flex:none;background:linear-gradient(135deg,#162E52,#1D5A9E);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;overflow:hidden;text-decoration:none}
.fd-av img{width:100%;height:100%;object-fit:cover}
.fd-av.sm{width:34px;height:34px;font-size:12px}

/* composer */
.fd-comp-top{display:flex;gap:12px;align-items:flex-start}
.fd-av.co{border-radius:10px;background:#fff;border:1px solid var(--border,#e3e8ee)}.fd-av.co img{object-fit:contain}
.fd-as{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px;align-items:center}
.fd-as-l{font-size:12px;color:var(--text-3,#6b7685);margin-right:2px}
.fd-as button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border,#e3e8ee);background:#fff;border-radius:999px;padding:3px 10px 3px 3px;font-size:12.5px;cursor:pointer;color:inherit;max-width:100%}
.fd-as button .fd-av{width:22px;height:22px;font-size:9px}
.fd-as button.on{border-color:var(--navy,#1b3a5b);background:#eef3f8;font-weight:600}
.fd-as button span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.fd-post-by{font-size:11.5px;color:var(--text-3,#6b7685)}.fd-post-by a{color:inherit;text-decoration:underline}
.fd-comp-t{font-family:var(--serif);font-size:17px;color:var(--text);margin:0 0 2px}
.fd-comp-sub{font-size:11.5px;color:var(--text3);line-height:1.5}
.fd-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.fd-chip{font-size:11px;font-family:var(--mono);padding:4px 10px;border-radius:16px;border:1px solid var(--border);background:var(--bg2);color:var(--text3);cursor:pointer;transition:all var(--dur-fast)}
.fd-chip:hover{border-color:var(--border2);color:var(--text2)}
.fd-chip.on{background:var(--blue-dim);border-color:rgba(29,90,158,.3);color:var(--blue)}
.fd-in{width:100%;background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:10px 12px;color:var(--text);font-family:inherit;font-size:13.5px;line-height:1.5;outline:none;transition:border-color var(--dur-fast)}
.fd-in:focus{border-color:var(--blue)}
.fd-in.title{font-weight:600;margin-bottom:8px}
.fd-ta{min-height:92px;resize:vertical}
.fd-row{display:flex;gap:8px;margin-top:8px}
.fd-row .fd-in{font-family:var(--mono);font-size:12px}
@media(max-width:560px){.fd-row{flex-direction:column}}
.fd-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px;flex-wrap:wrap}
.fd-attach{border:none;background:none;color:var(--blue);font-size:11.5px;font-weight:500;cursor:pointer;padding:0;margin-right:auto;font-family:inherit}
.fd-attach:hover{color:var(--blue-lt)}
.fd-count{font-size:10px;font-family:var(--mono);color:var(--text4)}
.fd-err{font-size:11.5px;color:var(--gold);margin-top:8px;min-height:13px}
.fd-ev-note{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5}

/* guest card */
.fd-guest{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fd-guest-t{font-family:var(--serif);font-size:18px;color:var(--text);margin:0 0 3px}
.fd-guest-s{font-size:12.5px;color:var(--text3);line-height:1.55}
.fd-guest-a{display:flex;gap:8px;margin-left:auto}

/* post */
.fd-post-h{display:flex;gap:12px;align-items:flex-start}
.fd-post-who{flex:1;min-width:0}
.fd-post-name{font-size:14px;font-weight:600;color:var(--text);text-decoration:none}
.fd-post-name:hover{color:var(--blue)}
.fd-post-role{font-size:11.5px;color:var(--text3);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd-post-meta{font-size:9.5px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--text4);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fd-type{display:inline-block;font-size:9px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:12px;background:var(--bg3);color:var(--text2)}
.fd-type.event{background:rgba(142,112,32,.14);color:var(--gold)}
.fd-type.deal,.fd-type.offering{background:rgba(12,143,92,.10);color:var(--green)}
.fd-type.market_view{background:var(--blue-dim);color:var(--blue)}
.fd-post-title{font-family:var(--serif);font-size:19px;font-weight:500;color:var(--text);margin:12px 0 4px;line-height:1.3;letter-spacing:-.01em}
.fd-post-txt{font-size:14px;color:var(--text);line-height:1.65;margin-top:10px;white-space:pre-wrap;word-break:break-word}
.fd-post-txt a{color:var(--blue);text-decoration:none}
.fd-post-txt a:hover{text-decoration:underline}
.fd-post-txt.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.fd-more{border:none;background:none;color:var(--blue);font-size:12px;cursor:pointer;padding:4px 0;font-family:inherit}
.fd-img{display:block;margin-top:12px;border-radius:var(--r2);overflow:hidden;border:1px solid var(--border)}
.fd-img img{width:100%;max-height:420px;object-fit:cover;display:block}
.fd-linkcard{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r2);background:var(--bg2);text-decoration:none;color:var(--text2);font-size:12.5px;transition:border-color var(--dur-fast)}
.fd-linkcard:hover{border-color:var(--blue);color:var(--text)}
.fd-linkcard .dom{font-family:var(--mono);font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.fd-event{display:flex;gap:14px;align-items:center;margin-top:12px;padding:12px 14px;border:1px solid rgba(142,112,32,.28);border-radius:var(--r2);background:rgba(142,112,32,.06)}
.fd-evdate{flex:none;width:52px;text-align:center;border-radius:var(--r1);background:var(--bg1);border:1px solid var(--border);padding:5px 0}
.fd-evdate .m{font-size:9px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.fd-evdate .d{font-family:var(--serif);font-size:22px;line-height:1;color:var(--text);margin-top:2px}
.fd-evinfo{flex:1;min-width:0}
.fd-evinfo .w{font-size:13px;color:var(--text);font-weight:500}
.fd-evinfo .l{font-size:11.5px;color:var(--text3);margin-top:2px}
.fd-evbtn{flex:none}
.fd-post-f{display:flex;align-items:center;gap:6px;margin-top:14px;padding-top:10px;border-top:1px solid var(--border)}
.fd-act{border:1px solid transparent;background:none;color:var(--text3);font-size:12px;cursor:pointer;padding:5px 10px;border-radius:var(--r1);font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all var(--dur-fast)}
.fd-act:hover{background:var(--bg2);color:var(--text)}
.fd-act.liked{color:#c0392b}
.fd-video{display:block;width:100%;max-height:540px;margin-top:10px;border-radius:12px;background:#000}
.fd-embed{position:relative;width:100%;padding-top:56.25%;margin-top:10px;border-radius:12px;overflow:hidden;background:#000}
.fd-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.fd-up-prev{margin:10px 0 0;position:relative}
.fd-up-prev img,.fd-up-prev video{display:block;max-height:220px;max-width:100%;border-radius:12px;background:#000}
.fd-up-prev .fd-up-rm{margin-top:8px;font-size:12px;color:var(--text2);background:none;border:1px solid var(--border);border-radius:8px;padding:5px 11px;cursor:pointer}
.fd-up-busy{font-size:13px;color:var(--text3)}
.fd-act.del{margin-left:auto;color:var(--text4)}
.fd-act.del:hover{color:var(--gold)}
.fd-empty{padding:var(--sp-xl);text-align:center;color:var(--text3);font-size:13px;line-height:1.6}
/* comments */
.fd-comments{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.fd-cm{display:flex;gap:10px;align-items:flex-start}
.fd-cm-b{flex:1;min-width:0;background:var(--bg2);border-radius:var(--r2);padding:8px 12px}
.fd-cm-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fd-cm-name{font-size:12.5px;font-weight:600;color:var(--text);text-decoration:none}
.fd-cm-name:hover{color:var(--blue)}
.fd-cm-role{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.fd-cm-time{font-size:10px;font-family:var(--mono);color:var(--text4);margin-left:auto}
.fd-cm-x{border:none;background:none;color:var(--text4);cursor:pointer;font-size:11px;padding:0 4px}
.fd-cm-x:hover{color:var(--gold)}
.fd-cm-txt{font-size:13px;color:var(--text);line-height:1.55;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.fd-cm-txt a{color:var(--blue);text-decoration:none}
.fd-cm-form{display:flex;gap:10px;align-items:flex-start}
.fd-cm-ta{flex:1;min-height:38px;resize:none;font-size:13px;padding:8px 11px}
.fd-cm-empty{font-size:12.5px;color:var(--text3);padding:4px 0}
.fd-loadmore{align-self:center}

/* rail */
.fd-rail-t{font-size:9px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.fd-ev-item{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);text-decoration:none}
.fd-ev-item:last-child{border-bottom:none}
.fd-ev-item .fd-evdate{width:44px;padding:4px 0}
.fd-ev-item .fd-evdate .d{font-size:18px}
.fd-ev-item .t{font-size:13px;color:var(--text);font-weight:500;line-height:1.35}
.fd-ev-item .h{font-size:11px;color:var(--text3);margin-top:2px}
.fd-ev-item:hover .t{color:var(--blue)}
.fd-rail-cta{font-size:12.5px;color:var(--text2);line-height:1.6}
.fd-rail-cta ul{margin:8px 0 12px;padding-left:18px}
.fd-rail-cta li{margin:3px 0}
.fd-me{padding:18px}
.fd-me-top{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.fd-me-name{font-size:15px;font-weight:600;color:var(--text);line-height:1.25}
.fd-me-sub{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.35}
.fd-me-loc{font-size:11.5px;color:var(--text3);margin-top:3px}
.fd-me-head{font-size:12.5px;color:var(--text2);line-height:1.5;margin-top:11px}
.fd-me-act{display:flex;gap:8px;margin-top:13px}
.fd-me-act .btn{flex:1;justify-content:center}
.fd-back{font-size:12px;color:var(--blue);text-decoration:none}
</style>
</head>
<body>

      <h1>Network Feed</h1>

<script>
Pegasus.boot(async function(){
  Pegasus.mountPublic('Feed');
  document.getElementById('footer').outerHTML = Pegasus.footer();

  var esc=Pegasus.esc;
  var ORIGIN='https://pegasuscapitalnetwork.com';
  var PAGE=20;

  /* ── Post types ─────────────────────────────────────────────────────────── */
  var TYPES=[
    ['update','Update'],['event','Event / Webinar'],['deal','Deal / Offer'],['market_view','Market view'],
    ['project','Project'],['story','Story'],['referral','Referral request'],['working_on','Working on']
  ];
  var LBL={update:'Update',event:'Event',deal:'Deal / Offer',offering:'Offer',market_view:'Market view',project:'Project',story:'Story',referral:'Referral request',working_on:'Working on',showcase:'Showcase',seeking_intro:'Seeking intro'};
  var FILTERS=[['','All'],['event','Events'],['deal','Deals & Offers'],['market_view','Market views'],['project','Projects'],['story','Stories'],['referral','Referrals']];
  var PLACEHOLDER={
    update:'Share what you’re working on, a win, or something worth seeing.',
    event:'What is the event about, who should attend, and how to join.',
    deal:'Describe the deal or offer: asset type, size, terms, market, what you’re looking for.',
    market_view:'Your read on rates, capital markets, or a local market.',
    project:'Tell the network about a project you’re building or financing.',
    story:'A story from a recent transaction or client.',
    referral:'Who are you looking to be introduced to, and why?',
    working_on:'What are you focused on this week?'
  };

  /* ── Helpers ────────────────────────────────────────────────────────────── */
  function initials(n){ var w=(n||'?').trim().split(/\s+/); return ((w[0]?w[0][0]:'')+(w[1]?w[1][0]:'')).toUpperCase()||'•'; }
  function avHTML(av,name,color,cls){
    var style=color?' style="background:'+esc(color)+'"':'';
    return '<span class="fd-av '+(cls||'')+'"'+style+'>'+(av?'<img src="'+esc(av)+'" alt="" loading="lazy">':esc(initials(name)))+'</span>';
  }
  function profileHref(p){ return p.author_slug ? '/u/'+encodeURIComponent(p.author_slug) : '/public-profile.html?id='+encodeURIComponent(p.user_id); }
  function ago(ts){ try{ var d=Math.max(0,(Date.now()-new Date(ts).getTime())/1000); if(d<60)return 'just now'; if(d<3600)return Math.floor(d/60)+'m ago'; if(d<86400)return Math.floor(d/3600)+'h ago'; if(d<86400*14)return Math.floor(d/86400)+'d ago'; return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }catch(e){ return ''; } }
  function safeUrl(u){ u=(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u.replace(/^\/+/,''); return Pegasus.safeUrl?Pegasus.safeUrl(u):esc(u); }
  function domainOf(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return (u||'').replace(/^https?:\/\//,'').split('/')[0]; } }
  /* Escape text, then turn bare URLs into links (escaped before wrapping). */
  function linkify(t){
    var re=/(https?:\/\/[^\s<>"']+)/g, out='', last=0, m;
    while((m=re.exec(t))){ out+=esc(t.slice(last,m.index)); out+='<a href="'+safeUrl(m[1])+'" target="_blank" rel="noopener noreferrer nofollow">'+esc(m[1].replace(/^https?:\/\//,'').slice(0,60))+'</a>'; last=m.index+m[1].length; }
    return out+esc(t.slice(last));
  }
  function evParts(ts){ var d=new Date(ts); return { m:d.toLocaleDateString('en-US',{month:'short'}), d:d.getDate(), when:d.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) }; }
  function rpcMissing(err){ var c=err&&(err.code||''); var m=(((err&&err.message)||'')+' '+((err&&err.details)||'')).toLowerCase(); return c==='PGRST202'||c==='404'||/does not exist|could not find the function|schema cache|not found/.test(m); }

  /* ── Session ────────────────────────────────────────────────────────────── */
  var sb=null; try{ sb=await window.PegSB.ready; }catch(e){}
  var session=null; try{ var sres=sb?await sb.auth.getSession():null; session=sres&&sres.data&&sres.data.session; }catch(e){}
  var MY_UID=session&&session.user&&session.user.id||null;
  var ME=(typeof Store!=='undefined'&&Store.get&&Store.get().profile)||{};
  var IS_ADMIN=false; try{ IS_ADMIN=!!(typeof Store!=='undefined'&&Store.isAdmin&&Store.isAdmin()); }catch(e){}

  /* ── State from URL ─────────────────────────────────────────────────────── */
  var qs=new URLSearchParams(location.search);
  var filter=(qs.get('type')||'').replace(/[^a-z_]/g,'');
  /* Permalinks: /feed/post/<id> (server-rendered OG tags) or legacy /feed?post=<id>. */
  var pathPost=(location.pathname.match(/^\/feed\/post\/([0-9a-f-]{36})/i)||[])[1]||'';

  async function handleUpload(input){
    var f=input.files&&input.files[0]; if(!f) return;
    var err=document.getElementById('fdErr'); if(err) err.textContent='';
    var isVid=/^video\//.test(f.type), isImg=/^image\//.test(f.type);
    if(!isVid&&!isImg){ if(err) err.textContent='Please choose a photo or a video.'; input.value=''; return; }
    var max=isVid?75*1024*1024:10*1024*1024;
    if(f.size>max){ if(err) err.textContent=isVid?'That video is too large (max 75MB).':'That image is too large (max 10MB).'; input.value=''; return; }
    var prev=document.getElementById('fdUpPrev'); if(prev){ prev.hidden=false; prev.innerHTML='<span class="fd-up-busy">Uploading '+esc(f.name)+'…</span>'; }
    try{
      var sres=await sb.auth.getSession(); var uid=sres&&sres.data&&sres.data.session&&sres.data.session.user&&sres.data.session.user.id;
      if(!uid){ if(err) err.textContent='Please sign in to upload.'; if(prev){ prev.hidden=true; prev.innerHTML=''; } input.value=''; return; }
      var ext=((f.name.split('.').pop()||'').toLowerCase().replace(/[^a-z0-9]/g,''))||(isVid?'mp4':'jpg');
      var path=uid+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
      var up=await sb.storage.from('feed-media').upload(path,f,{contentType:f.type,cacheControl:'3600',upsert:false});
      if(up.error) throw up.error;
      var pub=sb.storage.from('feed-media').getPublicUrl(path); var url=pub&&pub.data&&pub.data.publicUrl;
      if(!url) throw new Error('no public url');
      if(isImg){ upImg=url; upLink=''; } else { upLink=url; upImg=''; }
      input.value='';
      var keep=val('fdTa'), kt=val('fdTitle'); renderComposer(); setVal('fdTa',keep); setVal('fdTitle',kt); upd();
    }catch(e){ if(err) err.textContent='Upload failed. Please try again with a smaller file.'; var p2=document.getElementById('fdUpPrev'); if(p2){ p2.hidden=true; p2.innerHTML=''; } input.value=''; }
  }
  function videoEmbed(u){
    u=(u||'').trim(); if(!u) return '';
    var m=u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
    if(m) return '<div class="fd-embed"><iframe src="https://www.youtube.com/embed/'+m[1]+'" frameborder="0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>';
    m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if(m) return '<div class="fd-embed"><iframe src="https://player.vimeo.com/video/'+m[1]+'" frameborder="0" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>';
    if(/\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(u)) return '<video class="fd-video" src="'+safeUrl(u)+'" controls preload="metadata" playsinline></video>';
    return '';
  }

  async function loadComments(postId, postOwner){
    var host=document.getElementById('cm-'+postId); if(!host) return;
    host.hidden=false; host.innerHTML='<div class="fd-cm-empty">Loading…</div>';
    var rows=[];
    try{ var r=await sb.rpc('get_signal_comments',{p_id:postId,p_limit:100}); rows=(r&&Array.isArray(r.data))?r.data:[]; }catch(e){}
    var form=MY_UID
      ? '<form class="fd-cm-form" data-id="'+esc(postId)+'">'+avHTML(ME.avatar_url,ME.full_name||'Me',ME.avatar_color,'sm')+'<textarea class="fd-in fd-cm-ta" maxlength="600" rows="1" placeholder="Write a comment…"></textarea><button class="btn btn-pri btn-sm" type="submit">Comment</button></form><div class="fd-err fd-cm-err"></div>'
      : '<div class="fd-cm-empty"><a href="/signin.html?next=%2Ffeed" style="color:var(--blue)">Sign in</a> to comment.</div>';
    host.innerHTML=(rows.length?rows.map(function(c){return commentHTML(c,postOwner);}).join(''):'<div class="fd-cm-empty">No comments yet — start the conversation.</div>')+form;
    wireComments(host, postId, postOwner);

  function wireComments(host, postId, postOwner){
    var f=host.querySelector('.fd-cm-form');
    if(f){
      var ta=f.querySelector('textarea'); ta.addEventListener('input',function(){ ta.style.height='auto'; ta.style.height=Math.min(160,ta.scrollHeight)+'px'; });
      ta.addEventListener('keydown',function(e){ if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){ e.preventDefault(); f.requestSubmit(); } });
      f.onsubmit=async function(e){
        e.preventDefault(); var txt=ta.value.trim(), err=host.querySelector('.fd-cm-err'), btn=f.querySelector('button');
        if(!txt){ err.textContent='Write a comment first.'; return; }
        btn.disabled=true; err.textContent='';
        try{
          var r=await sb.rpc('add_signal_comment',{p_id:postId,p_content:txt}); var d=r&&r.data||{};
          if(r.error) throw r.error;
          if(!d.ok){ err.textContent=d.message||'Could not post the comment.'; btn.disabled=false; return; }
          await loadComments(postId, postOwner);
          var n=document.querySelector('.fd-act.cmt[data-id="'+postId+'"] .n'); if(n) n.textContent=(parseInt(n.textContent||'0',10)||0)+1;
        }catch(ex){ err.textContent='Could not post the comment right now.'; btn.disabled=false; }
      };
    }
    host.querySelectorAll('.fd-cm-x').forEach(function(b){ b.onclick=async function(){
      if(!confirm('Delete this comment?')) return; b.disabled=true;
      try{ var r=await sb.rpc('remove_signal_comment',{p_id:b.getAttribute('data-id')}); if(r&&r.data&&r.data.ok){ var el=b.closest('.fd-cm'); if(el) el.remove(); var n=document.querySelector('.fd-act.cmt[data-id="'+postId+'"] .n'); if(n) n.textContent=Math.max(0,(parseInt(n.textContent||'0',10)||0)-1); } else b.disabled=false; }catch(e){ b.disabled=false; }
    }; });
  }
  async function fillCommentCounts(rows){
    if(!sb||!rows.length) return;
    try{
      var r=await sb.rpc('get_signal_comment_counts',{p_ids:rows.map(function(p){return p.id;})});
      (r&&Array.isArray(r.data)?r.data:[]).forEach(function(x){ var n=document.querySelector('.fd-act.cmt[data-id="'+x.signal_id+'"] .n'); if(n) n.textContent=x.n||0; });
    }catch(e){}
  }
  function wire(root){
    root.querySelectorAll('.fd-more').forEach(function(b){ b.onclick=function(){ var t=b.previousElementSibling; if(t) t.classList.remove('clamp'); b.remove(); }; });
    root.querySelectorAll('.fd-act.like').forEach(function(b){ b.onclick=async function(){
      if(!MY_UID){ location.href='/signin.html?next=%2Ffeed'; return; }
      b.disabled=true;
      try{ var r=await sb.rpc('toggle_signal_like',{p_id:b.getAttribute('data-id')}); var d=r&&r.data||{}; if(d.ok){ b.classList.toggle('liked',!!d.liked); b.querySelector('.ic').textContent=d.liked?'♥':'♡'; b.querySelector('.n').textContent=d.count||0; } }catch(e){}
      b.disabled=false;
    }; });
    root.querySelectorAll('.fd-act.cmt').forEach(function(b){ b.onclick=function(){
      var id=b.getAttribute('data-id'), host=document.getElementById('cm-'+id); if(!host) return;
      if(!host.hidden){ host.hidden=true; host.innerHTML=''; return; }
      var art=b.closest('article'); var owner=art?art.getAttribute('data-owner'):null;
      loadComments(id, owner);
    }; });
    root.querySelectorAll('.fd-act.share').forEach(function(b){ b.onclick=async function(){
      var url=ORIGIN+'/feed/post/'+b.getAttribute('data-id');
      try{ if(navigator.share){ await navigator.share({url:url}); return; } }catch(e){ return; }
      try{ await navigator.clipboard.writeText(url); Pegasus.toast('✓','var(--green-dim)','Link copied','Share it anywhere — it opens this post.'); }catch(e){ prompt('Copy this link:',url); }
    }; });
    root.querySelectorAll('.fd-act.del').forEach(function(b){ b.onclick=async function(){
      if(!confirm('Delete this post? This cannot be undone.')) return;
      b.disabled=true;
      try{ var r=await sb.rpc('delete_signal',{p_id:b.getAttribute('data-id')}); if(r&&r.data&&r.data.ok){ var a=b.closest('article'); if(a) a.remove(); loadEvents(); } else b.disabled=false; }catch(e){ b.disabled=false; }
    }; });
  }

  async function loadFeed(reset){
    if(loading) return; loading=true;
    var list=document.getElementById('fdList'), more=document.getElementById('fdMore');
    if(reset){ list.innerHTML='<div class="fd-card"><div class="fd-empty">Loading the network…</div></div>'; more.style.display='none'; }
    var rows=[];
    try{
      var args=permalink?{p_limit:1,p_id:permalink}:{p_limit:PAGE,p_before:before,p_type:filter||null};
      var a2=Object.assign({},args); if(pageFilter&&!permalink) a2.p_presence=pageFilter;
      var r=sb?await sb.rpc('get_network_feed_v2',a2):null;
      if(r&&r.error&&rpcMissing(r.error)) r=await sb.rpc('get_network_feed',args);
      if(r&&r.error) throw r.error;
      rows=(r&&Array.isArray(r.data))?r.data:[];
    }catch(e){
      if(reset) list.innerHTML='<div class="fd-card"><div class="fd-empty">The feed is unavailable right now. Please try again shortly.</div></div>';
      loading=false; return;
    }
    if(reset) list.innerHTML='';
    if(!rows.length&&reset){
      list.innerHTML='<div class="fd-card"><div class="fd-empty">'+(permalink?'That post is no longer available. <a class="fd-back" href="/feed">See the full feed →</a>':(filter?'No '+esc((FILTERS.filter(function(f){return f[0]===filter;})[0]||['',''])[1].toLowerCase())+' yet — be the first to post one.':'Nothing here yet — be the first to post.'))+'</div></div>';
    }else{
      var frag=document.createElement('div'); frag.innerHTML=rows.map(postHTML).join('');
      wire(frag);
      while(frag.firstChild) list.appendChild(frag.firstChild);
      fillCommentCounts(rows);
      if(permalink&&rows[0]) loadComments(rows[0].id, rows[0].user_id);
    }
    if(rows.length){ before=rows[rows.length-1].created_at; }
    exhausted=permalink||rows.length<PAGE;
    more.style.display=exhausted?'none':'';
    loading=false;
  }
  document.getElementById('fdMore').onclick=function(){ loadFeed(false); };

  /* ── Upcoming events rail ───────────────────────────────────────────────── */
  async function loadEvents(){
    var host=document.getElementById('fdEvents');
    var rows=[];
    try{ var r=sb?await sb.rpc('get_upcoming_events',{p_limit:6}):null; rows=(r&&Array.isArray(r.data))?r.data:[]; }catch(e){}
    var items=rows.map(function(e){
      var d=evParts(e.event_at);
      return '<a class="fd-ev-item" href="/feed?post='+esc(e.id)+'"><div class="fd-evdate"><div class="m">'+esc(d.m)+'</div><div class="d">'+d.d+'</div></div>'+
        '<div><div class="t">'+esc(e.title||'Event')+'</div><div class="h">'+esc(d.when)+(e.event_location?' · '+esc(e.event_location):'')+'<br>'+esc(e.author_name)+(e.author_company?' · '+esc(e.author_company):'')+'</div></div></a>';
    }).join('');
    host.innerHTML='<div class="fd-rail-t">Upcoming events</div>'+(items||'<div class="fd-empty" style="padding:6px 0 10px;text-align:left">No events scheduled yet.</div>')+
      '<div style="margin-top:12px">'+(MY_UID?'<button class="btn btn-ghost btn-sm" type="button" id="fdPostEv">+ Post an event</button>':'<a class="btn btn-ghost btn-sm" href="/signup.html">Post your event</a>')+'<a href="/events" style="display:inline-block;margin-left:10px;font-size:12px;color:var(--text3);text-decoration:none">Event pages →</a></div>';
    var pe=document.getElementById('fdPostEv'); if(pe) pe.onclick=function(){ postType='event'; renderComposer(); window.scrollTo({top:0,behavior:'smooth'}); var t=document.getElementById('fdTitle'); if(t) t.focus(); };
  }

  /* ── Rail CTA ───────────────────────────────────────────────────────────── */
  document.getElementById('fdCta').innerHTML=MY_UID
    ? '<div class="fd-rail-t">Get more from your posts</div><ul><li>Lead with a headline — it’s what people scan.</li><li>Deals &amp; offers: asset, size, market, terms.</li><li>Events: title, date, and a registration link.</li><li>Add a link or image — posts with media get more attention.</li></ul><a class="btn btn-ghost btn-sm" href="'+(ME.profile_slug?'/u/'+esc(ME.profile_slug):'/profile.html')+'">View my public profile</a>'
    : '<div class="fd-rail-t">Why post here</div><ul><li>Your posts show up on your public profile and in search.</li><li>Reach lenders, brokers, advisors, and agents in one place.</li><li>Post deals, market views, projects, and events — free.</li></ul><a class="btn btn-pri btn-sm" href="/signup.html">Create Free Profile</a>';

  /* ── Go ─────────────────────────────────────────────────────────────────── */
  function renderMe(){
    var host=document.getElementById('fdMe'); if(!host) return;
    if(!MY_UID||!ME||!ME.full_name){ host.style.display='none'; return; }
    host.style.display='';
    var slug=ME.profile_slug, href=slug?'/u/'+encodeURIComponent(slug):'/profile.html';
    var sub=[ME.professional_title||ME.headline||'', ME.company_name||''].filter(Boolean).join(' · ');
    host.innerHTML='<div class="fd-card-b fd-me">'+
      '<a class="fd-me-top" href="'+href+'">'+avHTML(ME.avatar_url,ME.full_name,ME.avatar_color,'')+
      '<div class="fd-me-id"><div class="fd-me-name">'+esc(ME.full_name)+'</div>'+
      (sub?'<div class="fd-me-sub">'+esc(sub)+'</div>':'')+
      (ME.location?'<div class="fd-me-loc">'+esc(ME.location)+'</div>':'')+'</div></a>'+
      ((ME.headline&&ME.headline!==(ME.professional_title||''))?'<div class="fd-me-head">'+esc(ME.headline)+'</div>':'')+
      '<div class="fd-me-act"><a class="btn btn-ghost btn-sm" href="'+href+'">View profile</a><a class="btn btn-ghost btn-sm" href="/profile-edit.html">Edit</a></div>'+
      '</div>';
  }
  if(MY_UID&&sb){
    try{
      var pm=await sb.from('presence_members').select('can_publish_as,presences!inner(id,name,slug,logo_url,presence_type,status)').eq('user_id',MY_UID).eq('can_publish_as',true);
      (pm.data||[]).forEach(function(r){ var p=r.presences; if(p&&p.presence_type==='company'&&p.status==='active'&&!MY_PAGES.some(function(x){return x.id===p.id;})) MY_PAGES.push(p); });
      MY_PAGES.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
    }catch(e){}
  }
  if(postAs&&!curPage()) postAs='';
  renderMe();
  renderComposer();
  renderNudge();
  renderFilters();
  loadFeed(true);
  loadEvents();
  if(window.PegInvite) PegInvite.mount(document.getElementById('fdInvite'));
  if(permalink){ setTimeout(function(){ var a=document.getElementById('post-'+permalink); if(a) a.scrollIntoView({block:'start',behavior:'smooth'}); },400); }
});
</script>
</body>

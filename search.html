<!DOCTYPE html><html lang="en"><head>
<title>Search — Pegasus Capital Network</title>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Search companies, lenders, real estate finance firms and members across the Pegasus network.">
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500&family=IBM+Plex+Serif:wght@0,300;0,400;0,600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/pegasus.css?v=dealroom-entitlements-20260524-1529">
<link rel="icon" href="/assets/brand/favicon.ico" sizes="any">
<meta name="theme-color" content="#08111C">
<style>
.sr-wrap{max-width:860px;margin:36px auto 90px;padding:0 20px}
.sr-h1{font-family:var(--serif);font-weight:300;font-size:30px;color:var(--text);margin:0 0 4px}
.sr-sub{font-size:13.5px;color:var(--text2);margin-bottom:20px}
.sr-box{display:flex;align-items:center;gap:10px;background:var(--bg1);border:1px solid var(--border2);border-radius:14px;padding:4px 6px 4px 16px;box-shadow:var(--sh-lift)}
.sr-box:focus-within{border-color:var(--blue)}
.sr-box svg{width:20px;height:20px;color:var(--text3);flex:0 0 auto}
.sr-box input{flex:1;border:0;outline:0;background:transparent;font-family:var(--sans);font-size:16px;color:var(--text);padding:14px 0}
.sr-box input::placeholder{color:var(--text3)}
.sr-box button{flex:0 0 auto;border:0;border-radius:10px;background:var(--blue);color:#fff;font-family:var(--sans);font-weight:600;font-size:14px;padding:11px 20px;cursor:pointer}
.sr-count{font-size:12px;color:var(--text3);font-family:var(--mono);letter-spacing:.04em;margin:18px 2px 10px}
.sr-list{display:flex;flex-direction:column;gap:9px}
.sr-row{display:flex;gap:13px;align-items:center;border:1px solid var(--border);border-radius:13px;padding:13px 15px;background:var(--bg1);text-decoration:none;transition:border-color .15s,transform .15s}
.sr-row:hover{border-color:var(--blue);transform:translateY(-1px)}
.sr-av{flex:0 0 44px;width:44px;height:44px;border-radius:10px;object-fit:cover;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:600;font-size:16px;color:#fff;background:var(--blue)}
.sr-av.person{border-radius:50%}
.sr-main{flex:1;min-width:0}
.sr-nm{font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sr-badge{font-size:9.5px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--border2);color:var(--text2);background:var(--bg2);font-weight:500}
.sr-sb{font-size:12.5px;color:var(--text2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62ch}
.sr-go{flex:0 0 auto;color:var(--text3);font-size:18px}
.sr-empty{text-align:center;border:1px dashed var(--border2);border-radius:14px;padding:40px 22px;color:var(--text3)}
.sr-empty .big{font-family:var(--serif);font-weight:300;font-size:21px;color:var(--text2);margin-bottom:8px}
.sr-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:center}
.sr-chips a{font-size:12.5px;color:var(--text2);border:1px solid var(--border);border-radius:999px;padding:7px 14px;background:var(--bg1)}
.sr-chips a:hover{border-color:var(--blue);color:var(--text)}
</style>
<script src="/js/i18n.js?v=20261021e"></script><script src="/js/ticker.js?v=20261021b" defer></script>
</head><body>
<div class="sr-wrap">
  <h1 class="sr-h1">Search the network</h1>
  <div class="sr-sub">Companies, lenders, real estate finance firms and members — find anyone by name.</div>
  <form class="sr-box" role="search" id="srForm">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="search" id="srInput" placeholder="e.g. Anchor Loans, DSCR, bridge lender, a name…" autocomplete="off" autofocus aria-label="Search">
    <button type="submit">Search</button>
  </form>
  <div id="srBody"></div>
</div>

<script src="/js/pegasus-config.js?v=20261021a"></script>
<script src="/js/pegasus-supabase.js"></script>
<script src="/js/pegasus-entitlements.js"></script>
<script src="/js/pegasus-data.js"></script>
<script src="/js/pegasus-content.js"></script>
<script src="/js/pegasus-match.js"></script>
<script src="/js/pegasus-store.js"></script>
<script src="/js/pegasus-api.js"></script>
<script src="/js/pegasus-forms.js"></script>
<script src="/js/pegasus-auth.js?v=20261020b"></script>
<script src="/js/pegasus-core.js?v=20261116a"></script>
<script src="/js/pegasus-pages.js"></script>
<script>
Pegasus.boot(async function(){
  Pegasus.mountPublic('');
  var esc=Pegasus.esc, body=document.getElementById('srBody'), input=document.getElementById('srInput'), form=document.getElementById('srForm');
  document.body.insertAdjacentHTML('beforeend', Pegasus.footer());

  var c=null; try{ c=await window.PegSB.ready; }catch(e){ c=null; }

  function qget(){ try{ return new URLSearchParams(location.search).get('q')||''; }catch(e){ return ''; } }
  function initials(n){ return (String(n||'').trim().split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2)||'·').toUpperCase(); }
  function badge(kind){ return kind==='member'?'Member':'Company'; }

  function rowHTML(r){
    var isPerson=r.kind==='member';
    var av = r.logo_url
      ? '<img class="sr-av'+(isPerson?' person':'')+'" src="'+esc(r.logo_url)+'" alt="">'
      : '<div class="sr-av'+(isPerson?' person':'')+'">'+esc(initials(r.name))+'</div>';
    var cat = r.category ? '<span class="sr-badge">'+esc(String(r.category).replace(/_/g,' '))+'</span>' : '';
    return '<a class="sr-row" href="'+esc(r.url)+'">'+av+
      '<div class="sr-main"><div class="sr-nm">'+esc(r.name)+' <span class="sr-badge">'+badge(r.kind)+'</span>'+cat+'</div>'+
      (r.subtitle?'<div class="sr-sb">'+esc(r.subtitle)+'</div>':'')+
      '</div><span class="sr-go">→</span></a>';
  }

  function renderEmpty(q){
    body.innerHTML='<div class="sr-empty"><div class="big">'+(q?('No matches for “'+esc(q)+'”'):'Start typing to search')+'</div>'+
      '<div style="font-size:13px">Try a company name, a lender, a city, or a person. Or browse:</div>'+
      '<div class="sr-chips"><a href="/businesses">Business Directory</a><a href="/lenders">Lender Directory</a><a href="/rankings">Lender Rankings</a><a href="/members">Members</a><a href="/find-a-lender">Find a Lender</a></div></div>';
  }

  var lastQ=null, timer=null;
  async function run(q){
    q=String(q||'').trim();
    if(q===lastQ) return; lastQ=q;
    try{ history.replaceState(null,'','/search'+(q?('?q='+encodeURIComponent(q)):'')); }catch(e){}
    if(!q || q.length<2){ renderEmpty(q); return; }
    body.innerHTML='<div class="sr-count">Searching…</div>';
    var rows=[];
    try{ var r=await c.rpc('search_network',{p_q:q,p_limit:40}); rows=(r&&!r.error&&r.data)||[]; }catch(e){ rows=[]; }
    if(q!==lastQ) return; // a newer query superseded this one
    if(!rows.length){ renderEmpty(q); return; }
    body.innerHTML='<div class="sr-count">'+rows.length+(rows.length===40?'+':'')+' result'+(rows.length===1?'':'s')+'</div><div class="sr-list">'+rows.map(rowHTML).join('')+'</div>';
  }

  var q0=qget(); input.value=q0;
  form.addEventListener('submit',function(e){ e.preventDefault(); run(input.value); });
  input.addEventListener('input',function(){ clearTimeout(timer); timer=setTimeout(function(){ run(input.value); },220); });
  if(q0) run(q0); else renderEmpty('');
  input.focus();
});
</script>
</body></html>

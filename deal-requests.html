<!DOCTYPE html><html lang="en"><head><title>Financing Requests — Pegasus Network</title>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=IBM+Plex+Serif:ital,wght@0,300;0,400;0,600;1,300&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/pegasus.css">
<link rel="icon" href="/assets/brand/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<meta name="theme-color" content="#08111C">
<style>
.dr-intro{font-size:13px;color:var(--text3);line-height:1.6;margin:0 0 16px}
.dr-intro a,.dr-empty a{color:var(--blue);text-decoration:none}
.dr-co{font-size:12px;color:var(--text2);font-weight:500}
.dr-co a{color:var(--text);text-decoration:none;font-weight:600}
.dr-co a:hover{color:var(--blue)}
.dr-facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text3);margin:2px 0 8px}
.dr-facts b{color:var(--text2);font-weight:500}
.dr-notes{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:10px;padding:10px 12px;background:var(--bg2);border-radius:var(--r2);white-space:pre-wrap;word-break:break-word}
.dr-from{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--text2);padding-top:10px;border-top:1px solid var(--border)}
.dr-from a{color:var(--blue);text-decoration:none}
.dr-from .muted{color:var(--text3)}
.dr-from .btn{margin-left:auto}
.dr-gate{max-width:560px;margin:70px auto;padding:0 20px}
.dr-gate-card{background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:28px 26px}
.dr-eyebrow{font-size:9px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.dr-h1{font-family:var(--serif);font-weight:300;font-size:26px;line-height:1.15;color:var(--text);margin:0 0 8px}
.dr-sub{font-size:13.5px;color:var(--text2);line-height:1.6;margin-bottom:20px}
</style>
<script src="/js/i18n.js?v=20261021c"></script>
</head><body>
<div id="nav"></div>

<script src="/js/pegasus-config.js"></script>
<script src="/js/pegasus-supabase.js"></script>
<script src="/js/pegasus-entitlements.js"></script>
<script src="/js/pegasus-data.js"></script>
<script src="/js/pegasus-content.js"></script>
<script src="/js/pegasus-match.js"></script>
<script src="/js/pegasus-store.js"></script>
<script src="/js/pegasus-api.js"></script>
<script src="/js/pegasus-forms.js"></script>
<script src="/js/pegasus-auth.js?v=20261020b"></script>
<script src="/js/pegasus-core.js?v=20261021b"></script>
<script src="/js/pegasus-billing.js"></script>
<script src="/js/pegasus-pages.js"></script>
<script>
Pegasus.boot(async function(){
  var esc=Pegasus.esc;
  var TYPES={residential_purchase:'Home purchase (1–4 units)',residential_refi:'Refinance (1–4 units)',dscr_rental:'DSCR / rental property',fix_flip:'Fix & flip',bridge:'Bridge loan',construction:'Construction',multifamily:'Multifamily (5+ units)',commercial:'Commercial real estate',sba_business:'SBA / business loan'};

  /* ── Session: signed-out visitors get a sign-in prompt and come back here ── */
  var sb=null; try{ sb=await window.PegSB.ready; }catch(e){}
  var uid=null; if(sb){ try{ var u=await sb.auth.getUser(); uid=u&&u.data&&u.data.user&&u.data.user.id; }catch(e){} }
  if(!uid){
    Pegasus.mountPublic('');
    try{ localStorage.setItem('pegasus.redirectAfterAuth','/deal-requests'); }catch(_){}
    var gate=document.createElement('div'); gate.className='dr-gate';
    gate.innerHTML='<div class="dr-gate-card"><div class="dr-eyebrow">Financing Requests</div><div class="dr-h1">Sign in to see financing requests</div>'+
      '<div class="dr-sub">Deals sent from the <a href="/find-a-lender" style="color:var(--blue);text-decoration:none">Lender Matcher</a> to companies you manage on Pegasus appear here. Sign in and we’ll bring you right back.</div>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-pri" href="/signin.html">Sign In</a><a class="btn btn-ghost" href="/signup.html">Create Free Profile</a></div></div>';
    var navEl=document.getElementById('nav'); if(navEl) navEl.insertAdjacentElement('afterend',gate); else document.body.appendChild(gate);
    return;
  }

  var v=Pegasus.mountApp({active:'Financing Requests',title:'Financing Requests',sub:'Deals borrowers sent to the companies you manage'});
  v.innerHTML='<p class="dr-intro">Borrowers find your company with the <a href="/find-a-lender">Lender Matcher</a> and choose to send you their deal. Contact details appear only when the borrower chose to share them.</p><div id="drList"><div class="nr-empty">Loading…</div></div>';

  /* ── Helpers ────────────────────────────────────────────────────────────── */
  function when(ts){ try{ var d=Math.max(0,(Date.now()-new Date(ts).getTime())/1000); if(d<60)return 'just now'; if(d<3600)return Math.floor(d/60)+'m ago'; if(d<86400)return Math.floor(d/3600)+'h ago'; if(d<86400*14)return Math.floor(d/86400)+'d ago'; return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }catch(e){ return ''; } }
  function money(n){ n=Number(n)||0; return n>0?'$'+Math.round(n).toLocaleString('en-US'):''; }
  function validEmail(e){ return /^[^\s@<>"'()\\,;:]+@[^\s@<>"'()\\,;:]+\.[^\s@<>"'()\\,;:]+$/.test(String(e||'')); }

  function cardHTML(r){
    var d=(r.deal&&typeof r.deal==='object')?r.deal:{};
    var type=TYPES[d.type]||d.type||'Financing request';
    var amt=money(d.amount);
    var facts=[
      d.property?['Property',d.property]:null,
      d.timeline?['Timeline',d.timeline]:null
    ].filter(Boolean).map(function(f){ return '<span>'+esc(f[0])+': <b>'+esc(f[1])+'</b></span>'; }).join('');
    var co=r.company_slug?'<a href="/business/'+encodeURIComponent(r.company_slug)+'">'+esc(r.company||'Your company')+'</a>':esc(r.company||'Your company');
    var name=r.requester_name||'A Pegasus member';
    var who=r.requester_slug?'<a href="/u/'+encodeURIComponent(r.requester_slug)+'">'+esc(name)+'</a>':'<span>'+esc(name)+'</span>';
    var email=validEmail(r.requester_email)?String(r.requester_email):'';
    var contact=email
      ? '<a href="mailto:'+esc(email)+'">'+esc(email)+'</a>'
      : (r.requester_slug?'':'<span class="muted">Contact not shared</span>');
    var reply=email?'<a class="btn btn-pri btn-sm" href="mailto:'+esc(email)+'?subject='+encodeURIComponent('Your financing request on Pegasus')+'">Reply by email</a>':'';
    return '<div class="nr-card">'+
      '<div class="nr-top"><span class="nr-badge">'+esc(type)+'</span><span class="dr-co">to '+co+'</span><span class="nr-time">'+esc(when(r.created_at))+'</span></div>'+
      '<div class="nr-meta">'+[amt?esc(amt):'',d.state?'Property in '+esc(d.state):''].filter(Boolean).join(' · ')+'</div>'+
      (facts?'<div class="dr-facts">'+facts+'</div>':'')+
      (d.notes?'<div class="dr-notes">'+esc(d.notes)+'</div>':'')+
      '<div class="dr-from"><span class="muted">From</span> '+who+(contact?' · '+contact:'')+reply+'</div>'+
    '</div>';
  }

  /* ── Load ───────────────────────────────────────────────────────────────── */
  var host=document.getElementById('drList');
  try{
    var r=await sb.rpc('get_my_lender_requests',{p_limit:100});
    if(r&&r.error) throw r.error;
    var rows=(r&&Array.isArray(r.data))?r.data:[];
    if(!rows.length){
      host.innerHTML='<div class="nr-empty dr-empty">No financing requests yet. Requests from the Lender Matcher appear here for companies you manage.<div style="margin-top:12px"><a class="btn btn-ghost btn-sm" href="/my-presences.html">Manage your Business Pages →</a></div></div>';
      return;
    }
    host.innerHTML='<div class="nr-sec">'+rows.length+' '+(rows.length===1?'request':'requests')+'</div>'+rows.map(cardHTML).join('')+
      '<div class="nr-legal">Requests come from borrowers using the Pegasus Lender Matcher. Pegasus does not verify borrower information and is not a party to any loan.</div>';
  }catch(e){
    console.error('[deal-requests] load failed:',e);
    host.innerHTML='<div class="nr-empty">Financing requests are unavailable right now. Please try again shortly.</div>';
  }
});
</script>
</body></html>

<div class="auth-wrap"><div class="auth-card">
  <div class="auth-head"><div class="auth-mark"><img src="/assets/brand/pegasus-symbol.svg" alt="Pegasus" style="width:32px;height:32px;object-fit:contain"></div><div class="auth-title">Welcome back</div><div class="auth-sub">CAPITAL INFRASTRUCTURE · INSTITUTIONAL ACCESS</div></div>
  <div class="auth-body">
    <button class="btn btn-ghost" id="goGoogle" style="width:100%;justify-content:center;gap:10px;margin-bottom:14px" onclick="doGoogle()"><svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.614z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg><span>Continue with Google</span></button>    <button class="btn btn-ghost" id="goApple" style="width:100%;justify-content:center;gap:10px;margin-bottom:14px" onclick="doApple()"><svg width="16" height="16" viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg><span>Continue with Apple</span></button>    <div class="divider" style="margin:14px 0 16px">OR USE EMAIL</div>
    <div class="field"><label class="label" for="em">Work Email</label><input class="input" id="em" placeholder="you@firm.com"></div>
    <div class="field"><div style="display:flex;justify-content:space-between"><label class="label" for="pw">Password</label><a class="auth-alt" style="margin:0;font-size:10px" href="/forgot-password.html">Forgot?</a></div><div class="pw-wrap"><input class="input" type="password" id="pw" placeholder="••••••••"><button class="pw-toggle" type="button" aria-label="Show password" title="Show password">👁</button></div></div>

    <div class="divider">SECURE SESSION</div>
    <div style="text-align:center;font-size:10px;color:var(--text3);font-family:var(--mono)">&#128274; Encrypted · Supabase Auth</div>
    <div class="auth-alt">New to Pegasus? <a href="/signup.html">Create an account</a></div>
  </div></div></div>
<script>
Pegasus.mountPublic();
/* Guard: already signed in? Skip the form — route to dashboard or onboarding. */
(async function(){
  /* Save the page that linked here (for deep link after auth) */
  try {
    var _ref = document.referrer;
    if (_ref && _ref.indexOf(location.hostname) >= 0) {
      var _rPath = new URL(_ref).pathname;
      /* Only remember real destinations (a profile, business, opportunity or a
         member page). Marketing pages — above all the homepage — are not a
         destination: sending a member back to "/" after login is a dead end. */
      var _public = /^\/(index\.html)?$|^\/(signin|signup|auth-callback|forgot-password|reset-password|explore|how-it-works|about|faq|contact|terms|privacy|disclosures|trust-and-safety|borrowers|mortgage-brokers|real-estate-agents|rwa-|category-|founder-network|business-capital-funding|capital-sessions)/;
      if (!_public.test(_rPath)) {
        localStorage.setItem('pegasus.redirectAfterAuth', _rPath + new URL(_ref).search);
      }
    }
  } catch(_) {}
  try { var _nx=(new URLSearchParams(location.search).get('next')||'').trim(); if(_nx && _nx.charAt(0)==='/' && _nx.indexOf('//')!==0) localStorage.setItem('pegasus.redirectAfterAuth', _nx); } catch(_) {}
  try {
    var s = await PegAuth.getSession();
    if (s && s.user) {
      await Pegasus.store.hydrate();
      var p = Pegasus.store.get().profile;
      /* Signed-in home is the member's OWN profile page: a member lands on
         their page first and moves into the network from there. */
      if (p && p.profile_slug) { try { localStorage.setItem('peg_slug', p.profile_slug); } catch(e){} }
      location.replace(p ? '/feed' : '/profile-edit.html');
    }
  } catch(_) {}
})();
async function doApple(){
  var btn=document.getElementById('goApple'); btn.disabled=true; var prev=btn.innerHTML; btn.innerHTML='Redirecting to Apple…';
  try{ await PegAuth.signInWithApple(); /* browser navigates away to Apple */ }
  catch(e){ btn.disabled=false; btn.innerHTML=prev; document.getElementById('err').textContent=(e&&e.message)||'Apple sign-in unavailable.'; }
}
async function doGoogle(){
  var btn=document.getElementById('goGoogle'); btn.disabled=true; var prev=btn.innerHTML; btn.innerHTML='Redirecting to Google…';
  try{ await PegAuth.signInWithGoogle(); /* browser navigates away to Google */ }
  catch(e){ btn.disabled=false; btn.innerHTML=prev; document.getElementById('err').textContent=(e&&e.message)||'Google sign-in unavailable.'; }
}
async function doSignin(){
  const email=document.getElementById('em').value, password=document.getElementById('pw').value;
  const btn=document.getElementById('go'); btn.disabled=true; btn.textContent='Signing in…';
  try{
    await PegAuth.signIn({email,password});
    await Pegasus.store.hydrate();
    /* Routing law: never default to admin console or workspace. Return to the
       page the member was heading to, otherwise their OWN profile page (or
       the profile editor when no profile page exists yet). */
    var _p=Pegasus.store.get().profile||{};
    if(_p.profile_slug){ try{ localStorage.setItem('peg_slug',_p.profile_slug); }catch(e){} }
    var _dl=''; try{ _dl=localStorage.getItem('pegasus.redirectAfterAuth')||''; if(_dl) localStorage.removeItem('pegasus.redirectAfterAuth'); }catch(_){}
    var _valid=_dl && _dl.charAt(0)==='/' && _dl!=='/' && _dl!=='/index.html' && !_dl.startsWith('/signin') && !_dl.startsWith('/signup') && !_dl.startsWith('/auth-callback');
    var _home=(_p && _p.profile_slug) ? '/feed' : '/profile-edit.html';
    location.href = _valid ? _dl : _home;
  }catch(e){
    btn.disabled=false; btn.textContent='Access Workspace →';
    var raw=(e&&e.message)||'';
    var msg=raw.indexOf('missing email or phone')>=0||raw.indexOf('Missing email')>=0?'Please enter your email address.':
      raw.indexOf('Invalid login credentials')>=0?'Incorrect email or password. Please try again.':
      raw.indexOf('Email not confirmed')>=0?'Please confirm your email address before signing in.':
      raw||'Sign in failed. Please try again.';
    document.getElementById('err').textContent=msg;
  }
}
</script></body></html>

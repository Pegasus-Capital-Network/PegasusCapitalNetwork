<script>
Pegasus.boot(()=>{

// ── ADMIN GATE ─────────────────────────────────────────────────────────────
// Two-layer protection: (1) ALLOW_DEMO_FALLBACK=false already blocks
// unauthenticated users at the auth layer. (2) This check ensures even a
// signed-in non-admin cannot access the console — redirect them cleanly.
var _st = window.PegStore && window.PegStore.get ? window.PegStore.get() : {};
var _isLive  = _st.mode === 'live';
var _isAdmin = window.PegStore && typeof window.PegStore.isAdmin === 'function'
               ? window.PegStore.isAdmin()
               : (_st.profile && _st.profile.role === 'admin');
if(!_isLive)  { location.replace('/'); return; }          // not authenticated
if(!_isAdmin) { location.replace('/dashboard.html'); return; } // authenticated but not admin
// ── END ADMIN GATE ─────────────────────────────────────────────────────────

const v=Pegasus.mountApp({active:'Admin',title:'Admin Console',sub:'Platform operations'});
// KPI row
(async function loadAdminStats(){
    try{
      var c=await window.PegSB.ready;
      var dash=[['👥','—','Members','Live from Supabase','var(--blue)'],['▤','—','Public Pages','Directory','var(--green)'],['◎','—','Feed Posts','Network feed','var(--teal)'],['⚑','—','Pending Review','Claims + trust reviews','var(--amber)']];
      if(c){
        /* Each count is isolated so one failing table never blanks the row. */
        var cnt=async function(q){ try{ var r=await q; return (r&&typeof r.count==='number')?r.count:0; }catch(_){ return 0; } };
        var [mc,pc,fc,cl,tr]=await Promise.all([
          cnt(c.from('profiles').select('*',{count:'exact',head:true})),
          cnt(c.from('presences').select('id',{count:'exact',head:true}).eq('visibility','public_preview').eq('status','active')),
          cnt(c.from('member_signals').select('id',{count:'exact',head:true})),
          cnt(c.from('entity_claims').select('id',{count:'exact',head:true}).eq('status','pending')),
          cnt(c.from('trust_reviews').select('id',{count:'exact',head:true}).eq('status','pending'))
        ]);
        dash[0][1]=String(mc||0);
        dash[1][1]=String(pc||0);
        dash[2][1]=String(fc||0);
        dash[3][1]=String((cl||0)+(tr||0));
      }
      v.insertAdjacentHTML('beforeend','<div class="grid g4" style="margin-bottom:16px">'+dash.map(function(k){return '<div class="stat" style="--accent:'+k[4]+'"><div class="stat-ic">'+k[0]+'</div><div class="stat-v">'+k[1]+'</div><div class="stat-l">'+k[2]+'</div><div class="stat-m" style="color:'+k[4]+'">'+k[3]+'</div></div>';}).join('')+'</div>');
    }catch(e){
      v.insertAdjacentHTML('beforeend','<div class="panel" style="padding:18px;color:var(--text2);font-size:12px;margin-bottom:16px">Platform metrics load from Supabase. Verify database connection and RLS policies.</div>');
    }
  })();
// section tabs
v.insertAdjacentHTML('beforeend',
  '<div style="font-size:11px;color:var(--text3);margin-bottom:10px;font-family:var(--mono)">Other admin tools: '+
  '<a href="/admin-requests.html" style="color:var(--blue)">Requests</a> · <a href="/admin-trust-reviews.html" style="color:var(--blue)">Trust Reviews</a> · '+
  '<a href="/showcase-admin.html" style="color:var(--blue)">Showcase Moderation</a> · <a href="/admin/intelligence" style="color:var(--blue)">Capital Intelligence</a> · '+
  '<a href="/admin/partner-network" style="color:var(--blue)">Partner Network</a></div>'+
  '<div style="display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap" id="atabs"></div><div id="apanel"></div>');
const sections=['Users','Pegasus AI','Private Network','Feed','Invites','Claims','Deal Requests','Duplicates','Directory','Homepage Event','Subscriptions','Access System','Deal Rooms','Lender Profiles','Growth Partner Submissions','Match Activity','Analytics','Member Log','Manual Review','Platform Health','Schema & Repair'];
document.getElementById('atabs').innerHTML=sections.map((s,i)=>'<div class="toggle-opt '+(i===0?'on':'')+'" style="font-size:11px" onclick="aShow(\''+s+'\')">'+s+'</div>').join('');
function tbl(cols,rows){return '<div class="card"><table class="tbl"><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
const chip=(t,c)=>'<span class="badge '+c+'">'+t+'</span>';

/* ── Real-data loaders for admin tabs ────────────────────────────────────────
   These replace the previous hardcoded demo rows. Each loader queries
   Supabase, shows a loading state, then either a clean empty state or
   the real rows. Nothing is fabricated.
   Note: lender_appetite_profiles, financing_requests, and match_results
   all have OWNER-ONLY RLS in production. Admin-wide visibility requires
   admin SELECT policies in Supabase \u2014 not in scope for this frontend
   change. Until those policies are added, these tabs show only the admin's
   own rows (typically empty) and the empty state explains why. */
function adminEmpty(icon, title, body){
  return '<div style="text-align:center;padding:48px 24px;color:var(--text2);font-size:13px;background:var(--bg2);border:1px solid var(--border);border-radius:12px">'+
    '<div style="font-size:28px;margin-bottom:12px">'+icon+'</div>'+
    '<div style="font-weight:600;color:var(--text);font-size:14px;margin-bottom:8px">'+title+'</div>'+
    '<div style="max-width:520px;margin:0 auto;line-height:1.55;color:var(--text3);font-size:12px">'+body+'</div>'+
  '</div>';
}
/* ── Directory seeding (migration 082) — publish imported companies as public,
   claimable "unclaimed" business pages (Yelp-style). Admin-run, de-duplicated. ── */
async function loadDirectory(p){
  p.innerHTML='<div style="padding:40px;text-align:center;color:var(--text3);font-size:12px">Loading directory tools…</div>';
  try{
    var c=await window.PegSB.ready;
    var cnt=await c.rpc('count_publishable_company_stubs');
    var n=(cnt&&!cnt.error&&typeof cnt.data==='number')?cnt.data:0;
    var live=await c.from('presences').select('id',{count:'exact',head:true}).eq('visibility','public_preview').eq('status','active').neq('presence_type','personal');
    var liveN=(live&&typeof live.count==='number')?live.count:null;
    p.innerHTML=
      '<div class="card"><div class="card-body">'+
        '<div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px">Directory seeding</div>'+
        '<div style="font-size:12.5px;color:var(--text2);line-height:1.55;margin-bottom:14px">Publish imported companies (from Partner Network data) as public, claimable business pages. Only public business fields are shown (name, type, city, website) — never phone or email. Each page is marked <b>unclaimed</b> with a “Claim this page” call-to-action, and duplicates are skipped automatically.</div>'+
        '<div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px">'+
          '<div class="stat" style="--accent:var(--teal)"><div class="stat-v">'+n+'</div><div class="stat-l">Ready to publish</div></div>'+
          (liveN!=null?'<div class="stat" style="--accent:var(--blue)"><div class="stat-v">'+liveN+'</div><div class="stat-l">Live public pages</div></div>':'')+
        '</div>'+
        (n>0
          ? '<button class="btn btn-pri" id="dir-publish">Publish '+Math.min(n,100)+' unclaimed company page'+(n===1?'':'s')+'</button>'
          : '<div style="font-size:12.5px;color:var(--text3)">Nothing new to publish. Import more companies into Partner Network, then return here.</div>')+
        '<div id="dir-status" style="font-size:12px;color:var(--text3);margin-top:12px"></div>'+
      '</div></div>'+
      '<div class="card" style="margin-top:14px"><div class="card-head"><div class="card-title">Most viewed pages · last 30 days</div></div><div class="card-body" id="dir-views" style="font-size:12px;color:var(--text3)">Loading…</div></div>'+
      '<div class="card" style="margin-top:14px"><div class="card-head"><div class="card-title">Placements · Featured &amp; Sponsored</div></div><div class="card-body">'+
        '<div style="font-size:12px;color:var(--text2);line-height:1.55;margin-bottom:10px"><b>Featured</b> (house companies) show first on every directory page, in search and in the Lender Matcher. <b>Sponsored</b> (paid) show first where relevant — matching section/category/state in the directory, matching deal type in the matcher — until the end date. Both are labelled for visitors. HMDA rankings and awards are never affected.</div>'+
        '<div id="pl-list" style="font-size:12px;color:var(--text3)">Loading…</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:12px;font-size:12px">'+
          '<label>Page slug<br><input id="pl-slug" class="input" style="width:230px" placeholder="company-slug-abc12"></label>'+
          '<label>Type<br><select id="pl-kind" class="input"><option value="sponsored">Sponsored (paid)</option><option value="featured">Featured (house)</option></select></label>'+
          '<label>Ends<br><input id="pl-end" class="input" type="date"></label>'+
          '<label>Deal types (matcher, optional)<br><input id="pl-deals" class="input" style="width:220px" placeholder="residential_purchase, bridge"></label>'+
          '<label><input type="checkbox" id="pl-s-dir" checked> Directory</label><label><input type="checkbox" id="pl-s-search" checked> Search</label><label><input type="checkbox" id="pl-s-match" checked> Matcher</label>'+
          '<button class="btn btn-pri btn-sm" id="pl-add">Add placement</button></div>'+
        '<div id="pl-status" style="font-size:12px;margin-top:8px"></div>'+
      '</div></div>';
    /* Page views (presence_views_daily via admin_top_viewed_pages) — shows which
       companies attract visitors: the best candidates to nudge toward a claim. */
    (async function(){
      var hv=document.getElementById('dir-views'); if(!hv) return;
      try{
        var tv=await c.rpc('admin_top_viewed_pages',{p_days:30,p_limit:25});
        if(tv.error) throw tv.error;
        var rows=tv.data||[];
        hv.innerHTML=rows.length ? tbl(['Page','Category','Location','Views','Claimable'], rows.map(function(x){
          return ['<a href="/business/'+aesc(x.slug)+'" target="_blank" style="color:var(--text);font-weight:600">'+aesc(x.name)+'</a>', aesc(x.category||'—'), aesc(x.location||'—'), String(x.views), x.claimable?chip('unclaimed','b-trial'):chip('claimed','b-active')];
        })) : 'No page views recorded yet. Views are counted from real visitors (bots excluded), one per browser per day.';
      }catch(e){ hv.textContent='Page views unavailable.'; }
    })();
    /* Placements (migration 097): presence_placements is admin-only via RLS. */
    async function loadPlacements(){
      var hl=document.getElementById('pl-list'); if(!hl) return;
      try{
        var r=await c.from('presence_placements').select('id,kind,weight,surfaces,deal_types,starts_at,ends_at,note,presences(name,slug)').order('created_at',{ascending:false}).limit(100);
        if(r.error) throw r.error;
        var now=Date.now();
        var rows=(r.data||[]).filter(function(x){ return !x.ends_at || new Date(x.ends_at).getTime()>now; });
        hl.innerHTML=rows.length ? tbl(['Company','Type','Shows in','Deal types','Ends',''], rows.map(function(x){
          var pr=x.presences||{};
          return ['<a href="/business/'+aesc(pr.slug||'')+'" target="_blank" style="color:var(--text);font-weight:600">'+aesc(pr.name||'—')+'</a>',
            x.kind==='featured'?chip('featured','b-active'):chip('sponsored','b-trial'),
            aesc((x.surfaces||[]).join(', ')), aesc((x.deal_types||[]).join(', ')||'all'),
            x.ends_at?aesc(new Date(x.ends_at).toLocaleDateString()):'no end',
            '<button class="btn btn-ghost btn-sm" data-pl-end="'+aesc(x.id)+'">End now</button>'];
        })) : 'No active placements.';
        hl.querySelectorAll('[data-pl-end]').forEach(function(b){ b.onclick=async function(){
          if(!confirm('End this placement now?')) return;
          var u=await c.from('presence_placements').update({ends_at:new Date().toISOString()}).eq('id',b.getAttribute('data-pl-end'));
          if(u.error){ alert(u.error.message); return; } loadPlacements();
        }; });
      }catch(e){ hl.textContent='Placements unavailable — apply migration 097. ('+((e&&e.message)||e)+')'; }
    }
    loadPlacements();
    var plAdd=document.getElementById('pl-add');
    if(plAdd) plAdd.onclick=async function(){
      var st=document.getElementById('pl-status'), slug=(document.getElementById('pl-slug').value||'').trim().toLowerCase();
      var kind=document.getElementById('pl-kind').value, end=document.getElementById('pl-end').value;
      var surf=[]; if(document.getElementById('pl-s-dir').checked) surf.push('directory'); if(document.getElementById('pl-s-search').checked) surf.push('search'); if(document.getElementById('pl-s-match').checked) surf.push('matcher');
      var deals=(document.getElementById('pl-deals').value||'').split(',').map(function(t){ return t.trim(); }).filter(Boolean);
      if(!slug){ st.innerHTML='<span style="color:var(--red)">Enter the page slug (from /business/&lt;slug&gt;).</span>'; return; }
      if(kind==='sponsored' && !end){ st.innerHTML='<span style="color:var(--red)">Sponsored placements need an end date.</span>'; return; }
      if(!surf.length){ st.innerHTML='<span style="color:var(--red)">Pick at least one place to show it.</span>'; return; }
      try{
        var pr=await c.from('presences').select('id,name').eq('slug',slug).maybeSingle();
        if(pr.error) throw pr.error; if(!pr.data) throw new Error('No page with slug '+slug);
        var ins=await c.from('presence_placements').insert({presence_id:pr.data.id,kind:kind,weight:kind==='featured'?80:50,surfaces:surf,deal_types:deals.length?deals:null,ends_at:end?new Date(end+'T23:59:59').toISOString():null,note:'Added in admin'});
        if(ins.error) throw ins.error;
        st.innerHTML='<span style="color:var(--green)">Added: '+aesc(pr.data.name)+'</span>'; loadPlacements();
      }catch(e){ st.innerHTML='<span style="color:var(--red)">'+aesc((e&&e.message)||e)+'</span>'; }
    };
    var btn=document.getElementById('dir-publish');
    if(btn) btn.onclick=async function(){
      if(!confirm('Publish up to '+Math.min(n,100)+' companies as public unclaimed business pages? They become visible in the directory and to Google, each with a “claim” prompt.')) return;
      btn.disabled=true; btn.textContent='Publishing…';
      try{
        var r=await c.rpc('publish_unclaimed_company_stubs',{p_limit:100});
        if(r.error) throw r.error;
        var st=document.getElementById('dir-status');
        if(st) st.innerHTML='<span style="color:var(--green)">Published '+(r.data||0)+' new page(s).</span>';
        setTimeout(function(){ loadDirectory(p); }, 1200);
      }catch(err){ btn.disabled=false; btn.textContent='Publish'; var st=document.getElementById('dir-status'); if(st) st.innerHTML='<span style="color:var(--red)">'+((err&&err.message)||err)+'</span>'; }
    };
  }catch(err){
    p.innerHTML='<div class="banner bn-cancel"><div class="banner-msg">🔴 <span>Could not load directory tools — apply migration 082 in Supabase. ('+((err&&err.message)||err)+')</span></div></div>';
  }
}

/* ── Duplicate protection (migration 081) — read-only detection of likely
   duplicate business pages and profiles, so they can be reviewed/cleaned up
   before scaling the network. Detection only; nothing is merged automatically. ── */
async function loadDuplicates(p){
  p.innerHTML='<div style="padding:40px;text-align:center;color:var(--text3);font-size:12px">Scanning for duplicates…</div>';
  function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var TSEG={company:'business',capital_program:'business',fund:'fund',project:'project',showcase:'showcase',event:'event',property:'property'};
  try{
    var c=await window.PegSB.ready;
    var pr=await c.rpc('get_duplicate_presence_clusters');
    var pf=await c.rpc('get_duplicate_profile_clusters');
    if(pr.error) throw pr.error;
    var pres=(pr.data&&Array.isArray(pr.data))?pr.data:[];
    var profs=(pf&&!pf.error&&Array.isArray(pf.data))?pf.data:[];
    if(!pres.length && !profs.length){ p.innerHTML=adminEmpty('✓','No duplicates found','No business pages or profiles share a normalized name or email. The directory is clean.'); return; }
    function clusterCard(title, badge, items){
      return '<div class="card" style="margin-bottom:12px"><div class="card-body">'+
        '<div style="font-size:13.5px;font-weight:600;color:var(--text)">'+title+' <span class="badge b-none" style="font-weight:400">'+badge+'</span></div>'+
        '<div style="margin-top:8px">'+items+'</div></div></div>';
    }
    var presHtml=pres.map(function(cl){
      var items=(cl.items||[]).map(function(it){
        var seg=TSEG[it.presence_type]||'business';
        return '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 0;border-top:1px solid var(--border)">'+
          '<a href="/'+seg+'/'+encodeURIComponent(it.slug)+'" target="_blank" style="font-size:12.5px;font-weight:600;color:var(--text)">'+e(it.name)+'</a>'+
          '<span style="font-size:10px;color:var(--text3);font-family:var(--mono)">'+e(it.presence_type)+' · '+e(it.status)+' · '+e(it.visibility)+'</span></div>';
      }).join('');
      return clusterCard('Business: '+e(cl.key), (cl.count||0)+' pages', items);
    }).join('');
    var profHtml=profs.map(function(cl){
      var items=(cl.items||[]).map(function(it){
        var link=it.slug?('/u/'+encodeURIComponent(it.slug)):'';
        return '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 0;border-top:1px solid var(--border)">'+
          (link?'<a href="'+link+'" target="_blank" style="font-size:12.5px;font-weight:600;color:var(--text)">'+e(it.name||'(no name)')+'</a>':'<span style="font-size:12.5px;font-weight:600;color:var(--text)">'+e(it.name||'(no name)')+'</span>')+
          '<span style="font-size:10px;color:var(--text3);font-family:var(--mono)">'+e(it.email||'—')+(it.role?(' · '+e(it.role)):'')+'</span></div>';
      }).join('');
      return clusterCard('Profile: '+e(cl.key), (cl.count||0)+' · '+e(cl.reason||''), items);
    }).join('');
    p.innerHTML=
      '<div style="font-size:11px;color:var(--text3);margin-bottom:10px;font-family:var(--mono)">'+pres.length+' business cluster(s) · '+profs.length+' profile cluster(s)</div>'+
      '<div style="font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.5">Review-only. Same-name profiles may be genuine namesakes — the email helps you judge. To remove a duplicate business page, archive it from its page; profile merges are handled manually for now.</div>'+
      (pres.length?'<div style="font-size:9px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:4px 0 8px">Business pages</div>'+presHtml:'')+
      (profs.length?'<div style="font-size:9px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:12px 0 8px">Profiles</div>'+profHtml:'');
  }catch(err){
    p.innerHTML='<div class="banner bn-cancel"><div class="banner-msg">🔴 <span>Could not scan duplicates — apply migration 081 in Supabase. ('+((err&&err.message)||err)+')</span></div></div>';
  }
}

/* ── Entity claims review (migration 080) — approve/reject "claim this page"
   requests. Approving adds the claimant as a manager of the presence. ── */
async function loadPegasusAI(p){
  p.innerHTML='<div style="padding:40px;text-align:center;color:var(--text3);font-size:12px">Loading Pegasus AI…</div>';
  function esc(x){return (x==null?'':String(x)).replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];});}
  try{
    var c=await window.PegSB.ready;
    var needsRes=await c.from('ai_needs').select('id,need_title,need_description,budget_range,timeline,category,company,poster_name,poster_email,is_large_company,status,created_at').order('created_at',{ascending:false}).limit(200);
    if(needsRes.error) throw needsRes.error;
    var signRes=await c.from('ai_network_signups').select('id,side,full_name,org_name,email,focus_area,one_liner,location,status,created_at').order('created_at',{ascending:false}).limit(200);
    var needs=needsRes.data||[], signs=(signRes&&signRes.data)||[];
    window.__aiNeeds=needs;

// Full account deletion (auth.users + cascade) — runs server-side via the
// delete-user Netlify Function, which re-verifies the caller is an admin using
// the service_role key. The frontend never sees that key.
window.usrDelete=async function(id){
  var all=window.__usrRows||[];
  var m=all.filter(function(x){return x.id===id;})[0]||{};
  var name=m.full_name||'this member';
  if(!confirm('Permanently delete '+name+'?\n\n'+
    'This removes their account, profile, and submissions, and frees their email to sign up again. '+
    'Messages they sent are kept but shown as from a removed member.\n\nThis cannot be undone.')) return;
  try{
    var c=await window.PegSB.ready;
    var sess=(await c.auth.getSession()).data.session;
    if(!sess){ alert('Your session expired — please sign in again.'); return; }
    var r=await fetch('/.netlify/functions/delete-user',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+sess.access_token},
      body:JSON.stringify({user_id:id})
    });
    var d={}; try{ d=await r.json(); }catch(_){}
    if(!r.ok||!d.deleted){ alert('Delete failed: '+((d&&d.reason)||('HTTP '+r.status))); return; }
    window.__usrRows=all.filter(function(x){return x.id!==id;});
    usrFilter();
    var cnt=document.getElementById('usr-count'); if(cnt) cnt.textContent=window.__usrRows.length+' members';
  }catch(e){ alert('Delete failed: '+((e&&e.message)||e)); }
};

function barList(items, color){
  items=items||[]; if(!items.length) return '<div style="font-size:12px;color:var(--text3);padding:6px 0">No data yet.</div>';
  var max=Math.max.apply(null,items.map(function(i){return Number(i.n)||0;}))||1;
  return items.map(function(i){ var n=Number(i.n)||0; return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px"><span style="text-transform:capitalize">'+aesc(String(i.k||i.m||'').replace(/_/g,' '))+'</span><span class="kv-v">'+n+'</span></div><div class="bar" style="margin:0"><div class="bar-f" style="width:'+Math.max(2,Math.round(n/max*100))+'%;background:'+(color||'var(--blue)')+'"></div></div></div>'; }).join('');
}
function adminLoading(label){
  return '<div style="text-align:center;padding:40px;color:var(--text3);font-size:12px">'+(label||'Loading\u2026')+'</div>';
}
function fmtMoney(n){ try { return Pegasus.fmt(n); } catch(_) { return '$'+Number(n||0).toLocaleString(); } }

async function loadSubscriptions(p){
  p.innerHTML = adminLoading('Loading subscriptions…');
  try {
    var c = await window.PegSB.ready;
    var res = await c.from('subscriptions')
      .select('user_id,tier,status,source,billing_cycle,trial_end,current_period_end,cancel_at_period_end,updated_at')
      .order('updated_at', { ascending: false })
      .limit(200);
    if (res.error) { p.innerHTML = adminErr(res.error.message); return; }
    var rows = res.data || [];
    if (!rows.length){
      p.innerHTML = adminEmpty('💳','No subscriptions yet',
        'Subscriptions appear here once members upgrade via an access code or Stripe.');
      return;
    }
    var names = await namesFor(c, rows.map(function(r){ return r.user_id; }));
    p.innerHTML = '<div style="font-size:11px;color:var(--text3);margin-bottom:10px;font-family:var(--mono)">'+rows.length+' subscription record(s)</div>'+tbl(
      ['Member','Tier','Status','Source','Expires','Updated'],
      rows.map(function(r){
        var exp = r.trial_end || r.current_period_end;
        var tierCls = r.tier==='gold' ? 'b-active' : r.tier==='pro' ? 'b-trial' : 'b-none';
        return [
          userCell(names, r.user_id),
          chip((r.tier||'—'), tierCls),
          chip((r.status||'active'), r.status==='active' ? 'b-active' : 'b-cancel'),
          (r.source||'—'),
          exp ? new Date(exp).toLocaleDateString() : '—',
          r.updated_at ? new Date(r.updated_at).toLocaleDateString() : '—'
        ];
      })
    );
  } catch(e){ p.innerHTML = adminErr(e.message); }
}

      '</div>'+

        '<div style="font-size:11px;color:var(--text3);font-family:var(--mono)">Latest '+rows.length+' post(s) · <a href="/feed" target="_blank" style="color:var(--blue)">Open the feed →</a></div>'+

        var body = (x.title?'<div style="font-weight:600;color:var(--text)">'+aesc(x.title)+'</div>':'')+'<div style="max-width:420px;white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.5">'+aesc((x.content||'').length>220?(x.content||'').slice(0,220)+'…':(x.content||''))+'</div>'+
          (x.event_at?'<div style="font-size:11px;color:var(--gold);margin-top:3px">📅 '+aesc(aWhen(x.event_at))+(x.event_location?' · '+aesc(x.event_location):'')+'</div>':'')+
          (x.link_url?'<div style="font-size:11px;margin-top:3px"><a href="'+aesc(x.link_url)+'" target="_blank" rel="noopener noreferrer nofollow" style="color:var(--blue)">↗ '+aesc(x.link_url.replace(/^https?:\/\//,'').slice(0,48))+'</a></div>':'')+

        return [ who, chip(aesc(FEED_LBL[x.signal_type]||x.signal_type||'update'), x.signal_type==='event'?'b-trial':'b-none'), body, String(x.like_count||0), aWhen(x.created_at),

      }));
  }catch(e){ p.innerHTML = adminErr((e&&e.message)||'Could not load the feed. Apply supabase/086_network_feed.sql.'); }

window.feedDelete=async function(id){
  var x=(window.__feedRows||[]).filter(function(r){return r.id===id;})[0]||{};
  if(!confirm('Delete this post by '+(x.author_name||'a member')+'?\n\nIt is removed from the feed and from their profile. This cannot be undone.')) return;
  try{
    var c=await window.PegSB.ready;
    var r=await c.rpc('delete_signal',{p_id:id});
    if(r.error) throw r.error;
    if(!(r.data&&r.data.ok)){ alert('Could not delete this post.'); return; }
    loadFeedAdmin(document.getElementById('apanel'));
  }catch(e){ alert('Delete failed: '+((e&&e.message)||e)); }
};

    (more?'<div style="font-size:11px;color:var(--text3);margin-top:2px">'+more+'</div>':'')+

async function loadInvites(p){
  p.innerHTML = adminLoading('Loading invite campaign…');
  try{
    var c = await window.PegSB.ready;
    var res = await c.from('pn_invite_consent')
      .select('id,email,full_name,company,city,state,source,status,consented_at,opted_out_at,provisioned_at,profile_id,send_count,last_sent_at,created_at,delivery_status')
      .order('created_at',{ascending:false}).limit(6000);
    if (res.error) { p.innerHTML = adminErr(res.error.message); return; }
    var all = res.data || [];
    window.__invAll = all;
    // Rows queued for the global outreach but not yet emailed are not "invited" yet.
    var rows = all.filter(function(r){ return !!r.last_sent_at || r.status!=='invited'; });
    window.__invRows = rows;
    var queued = all.length - rows.length;

var TABLE_MIGRATION = {
  member_connections:'supabase/060_member_connections.sql',
  engagement_requests:'supabase/055_engagement_requests.sql',
  opportunities:'supabase/054_opportunities.sql',
  presences:'supabase/047_presence_graph_foundation.sql',
  notifications:'supabase/021_referrals_notifications.sql'
};
function srEsc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function srPill(ok){ return ok
  ? '<span class="badge b-active">OK</span>'
  : '<span class="badge" style="background:#fdecea;color:#c0392b">Broken</span>'; }
window.srCopy=function(key){
  var sql = window.__SR_SQL && window.__SR_SQL[key];
  if(!sql) return;
  try{ if(navigator.clipboard) navigator.clipboard.writeText(sql); }catch(e){}
  if(window.Pegasus&&Pegasus.toast) Pegasus.toast('⧉','var(--green-dim)','Repair SQL copied','Paste it into Supabase → SQL Editor.');
};
async function loadSchemaRepair(p){
  p.innerHTML='<div class="card"><div class="card-body" style="padding:18px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">'+
      '<div><div style="font-family:var(--serif);font-size:18px;color:var(--text)">Schema &amp; Repair Center</div>'+
      '<div style="font-size:12.5px;color:var(--text3);margin-top:3px;max-width:640px">Detects missing tables, columns, and RPC functions this database depends on. Repairs are offered as safe, additive SQL you copy and run in Supabase — nothing is applied automatically.</div></div>'+
      '<button class="btn btn-pri btn-sm" onclick="loadSchemaRepair(document.getElementById(\'apanel\'))">Re-run Health Check</button>'+
    '</div></div></div>'+
    '<div id="srBody" style="margin-top:14px"><div class="card"><div class="card-body" style="padding:24px;text-align:center;color:var(--text3);font-size:12px">Running schema health check…</div></div></div>';
  var body=document.getElementById('srBody');
  window.__SR_SQL = {};
  try{
    var sb=await window.PegSB.ready;
    var r=await sb.rpc('health_check_schema');
    if(r.error) throw r.error;
    var rep=r.data||{};
    if(!rep.ok){
      body.innerHTML='<div class="banner bn-cancel"><div class="banner-msg">🔒 <span>'+srEsc(rep.message||'Not authorized.')+'</span></div></div>';
      return;
    }
    var html='';

    /* Summary */
    var broken=[];
    (rep.tables||[]).forEach(function(t){ if(!t.exists) broken.push('table '+t.name); });
    (rep.columns||[]).forEach(function(c){ if(!c.exists) broken.push('column '+c.table+'.'+c.column); });
    (rep.functions||[]).forEach(function(f){ if(!f.exists) broken.push('function '+f.name+'()'); });
    html += broken.length
      ? '<div class="banner bn-cancel" style="margin-bottom:14px"><div class="banner-msg">🔴 <span>'+broken.length+' issue'+(broken.length===1?'':'s')+' detected. Apply the suggested migrations below, then re-run.</span></div></div>'
      : '<div class="banner bn-active" style="margin-bottom:14px"><div class="banner-msg">🟢 <span>All required tables, columns, and functions are present. Pegasus is production-ready.</span></div></div>';

    /* Tables */
    html+='<div class="card" style="margin-bottom:12px"><div class="card-head"><div class="card-title">Database Tables</div></div><div class="card-body"><table class="tbl"><tbody>';
    (rep.tables||[]).forEach(function(t){
      var fix='';
      if(!t.exists){ var mig=TABLE_MIGRATION[t.name]||'the relevant migration'; fix='<div style="font-size:11px;color:var(--text3)">Apply '+srEsc(mig)+'</div>'; }
      html+='<tr><td style="font-family:var(--mono);font-size:12px">'+srEsc(t.name)+'</td><td>'+srPill(t.exists)+'</td><td>'+fix+'</td></tr>';
    });
    html+='</tbody></table></div></div>';

    /* Columns */
    html+='<div class="card" style="margin-bottom:12px"><div class="card-head"><div class="card-title">Columns</div></div><div class="card-body"><table class="tbl"><tbody>';
    (rep.columns||[]).forEach(function(c){
      var key=c.table+'.'+c.column; var fix='';
      if(!c.exists){
        var sql=REPAIR_SQL[key] || ('alter table public.'+c.table+' add column if not exists '+c.column+' text;');
        window.__SR_SQL[key]=sql;
        fix='<button class="btn btn-ghost btn-sm" onclick="srCopy(\''+key+'\')">Copy repair SQL</button>';
      }
      html+='<tr><td style="font-family:var(--mono);font-size:12px">'+srEsc(key)+'</td><td>'+srPill(c.exists)+'</td><td>'+fix+'</td></tr>';
    });
    html+='</tbody></table></div></div>';

    /* Functions */
    html+='<div class="card" style="margin-bottom:12px"><div class="card-head"><div class="card-title">RPC Functions</div></div><div class="card-body"><table class="tbl"><tbody>';
    (rep.functions||[]).forEach(function(f){
      var fix='';
      if(!f.exists){ var mig=FN_MIGRATION[f.name]||'the relevant migration'; fix='<div style="font-size:11px;color:var(--text3)">Apply '+srEsc(mig)+'</div>'; }
      html+='<tr><td style="font-family:var(--mono);font-size:12px">'+srEsc(f.name)+'()</td><td>'+srPill(f.exists)+'</td><td>'+fix+'</td></tr>';
    });
    html+='</tbody></table></div></div>';

    /* Feature readiness — derived from the checks above */
    function feat(name, ok){ return '<tr><td>'+srEsc(name)+'</td><td>'+srPill(ok)+'</td></tr>'; }
    function hasFn(n){ return (rep.functions||[]).some(function(f){return f.name===n&&f.exists;}); }
    function hasTbl(n){ return (rep.tables||[]).some(function(t){return t.name===n&&t.exists;}); }
    function hasCol(t,c){ return (rep.columns||[]).some(function(x){return x.table===t&&x.column===c&&x.exists;}); }
    html+='<div class="card"><div class="card-head"><div class="card-title">Feature Readiness</div></div><div class="card-body"><table class="tbl"><tbody>'+
      feat('Opportunity system', hasTbl('opportunities')&&hasFn('create_opportunity'))+
      feat('Engagement requests', hasTbl('engagement_requests')&&hasFn('create_engagement_request'))+
      feat('Connection requests', hasTbl('member_connections')&&hasFn('send_member_connection'))+
      feat('Notification system', hasTbl('notifications')&&hasCol('notifications','kind')&&hasFn('create_notification'))+
      feat('Public live strip', hasFn('get_recent_network_activity')&&hasFn('get_public_presentations'))+
      '</tbody></table></div></div>';

    body.innerHTML=html;
  }catch(e){
    body.innerHTML='<div class="banner bn-cancel"><div class="banner-msg">⚠️ <span>Could not run the schema health check'+
      ((e&&e.message)?': '+srEsc(e.message):'')+'. Apply <span style="font-family:var(--mono)">supabase/062_health_check_schema.sql</span> and try again.</span></div></div>';
  }
}
aShow('Users');

});
</script></body></html>

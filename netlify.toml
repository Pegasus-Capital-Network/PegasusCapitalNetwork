# No "/* -> /index.html" catch-all: multi-page static site, not an SPA.

# ════════════════════════════════════════════════════════════════════════════
# HEADERS
# ════════════════════════════════════════════════════════════════════════════
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    # NOTE: a Content-Security-Policy is intentionally omitted for now — the site
    # uses inline event handlers (onclick=) and inline styles throughout, so an
    # enforcing CSP would require 'unsafe-inline' (which negates its XSS value)
    # until those are refactored. Add a Report-Only CSP first when ready.

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/public-profile.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/presence.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/members.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/feed.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/build-info.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# NOTE: /js and /css are NOT marked immutable because page <script>/<link>
# includes are inconsistently versioned (some use ?v=BUILD, some don't). A long
# immutable TTL would serve stale JS to pages with un-versioned includes after a
# deploy. Keep a short TTL until ALL includes carry a ?v=BUILD query, then bump
# these to "public, max-age=31536000, immutable" safely.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Brand assets (images, fonts, favicons) are stable and safe to cache long.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Private admin module — never cache, never index.
[[headers]]
  for = "/admin-intelligence.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/intelligence"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin-partner-network.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/partner-network"

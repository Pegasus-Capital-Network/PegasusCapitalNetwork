    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# ════════════════════════════════════════════════════════════════════════════
# SCHEDULED FUNCTIONS (unchanged)
# ════════════════════════════════════════════════════════════════════════════
[functions."scheduled-health-check"]
  schedule = "0 15 * * 1"

# Concierge profile builder — provisions accounts + sends activation links to
# invitees who clicked "Yes" (consented). Idempotent; guarded by provisioned_at.
# Sends via PEGASUS_RESEND_API_KEY (verified crdpartners2020 sending key).
[functions."concierge-build"]
  schedule = "*/15 * * * *"

# Weekly "This week in the network" digest to members (Tuesdays 16:00 UTC =
# 9am PT). Skips itself when nothing happened. Opt-out via /unsubscribe?digest=1.
[functions."weekly-digest"]
  schedule = "0 16 * * 2"

# Global invitation outreach — hourly; the function itself enforces the send
# window, ramped daily cap, and auto-pause on bounces/complaints
# (pn_settings 'outreach_global'; pause/resume in Admin → Invites).
[functions."outreach-sender"]
  schedule = "10 * * * *"

# One-time profile-completion reminder for members who signed up 1–21 days ago
# and never finished onboarding (daily, ~9:17 PT). Eligibility: migration 102.
[functions."profile-reminder"]
  schedule = "17 16 * * *"

# Member referral invitations ("Invite colleagues") — sent within ~15 min of a
# member queuing them; honours the global outreach pause.
[functions."referral-sender"]
  schedule = "*/15 * * * *"


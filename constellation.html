<title>The Constellation of Pegasus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* A cinematic night sky (the Pegasus hero film) carries the whole piece;
   the manifesto fades in line by line in time with the narration. */
:root{
  --void:#05080f; --star:#eef3fa; --mist:#9fb2c6; --gold:#C8A244; --gold-2:#E3C57E;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--star);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0;overflow:hidden;background:#05080f}
#pvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.scrim{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:
   radial-gradient(72% 52% at 50% 54%, rgba(4,7,13,.55) 0%, rgba(4,7,13,.18) 52%, rgba(4,7,13,.5) 100%),
   linear-gradient(180deg, rgba(4,7,13,.4) 0%, rgba(4,7,13,0) 22%, rgba(4,7,13,0) 68%, rgba(4,7,13,.62) 100%)}

/* verse */
.wrap{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
  padding-left:max(22px,env(safe-area-inset-left,0px));
  padding-right:max(22px,env(safe-area-inset-right,0px));text-align:center}
#line{max-width:14em;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;
  font-size:clamp(27px,4.7vw,48px);line-height:1.26;letter-spacing:.004em;color:#f4f8fd;
  opacity:0;transform:translateY(9px);transition:opacity .5s ease,transform .5s ease;
  text-wrap:balance;text-shadow:0 2px 26px rgba(0,0,0,.85),0 0 60px rgba(0,0,0,.5)}
#line.show{opacity:1;transform:none}
#line .g{color:var(--gold-2);font-style:italic}
#line .rise{text-transform:uppercase;letter-spacing:.09em;color:var(--gold-2);font-weight:600}

/* entry */
#overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:24px;text-align:center;
  padding:max(24px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 90% at 50% 34%, rgba(7,13,22,.5), rgba(4,7,13,.9));
  transition:opacity 1.2s ease}
#overlay.gone{opacity:0;pointer-events:none}
.eyebrow{font-size:12px;letter-spacing:.44em;text-transform:uppercase;color:var(--gold);font-weight:600}
.mark{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
  font-size:clamp(46px,9.5vw,92px);letter-spacing:.015em;line-height:.98;color:#f4f7fc}
.sub{font-size:14.5px;color:var(--mist);max-width:30em;line-height:1.65}
.begin{margin-top:8px;appearance:none;background:transparent;color:var(--gold-2);
  border:1px solid rgba(200,162,68,.5);border-radius:999px;padding:15px 38px;
  font-family:Inter,sans-serif;font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;
  font-weight:600;cursor:pointer;transition:background .3s,border-color .3s,color .3s}
.begin:hover{background:rgba(200,162,68,.12);border-color:var(--gold-2);color:#fff}
.begin:focus-visible{outline:2px solid var(--gold-2);outline-offset:4px}
.note{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6b7f96}

/* close */
#end{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:26px;text-align:center;opacity:0;pointer-events:none;
  transition:opacity 1.6s ease;
  padding-left:max(24px,env(safe-area-inset-left,0px));
  padding-right:max(24px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 90% at 50% 50%, rgba(5,8,15,.2), rgba(5,8,15,.66))}
#end.show{opacity:1;pointer-events:auto}
#end .dot{width:7px;height:7px;border-radius:50%;background:var(--gold-2);box-shadow:0 0 22px 6px rgba(227,197,126,.5)}
#end .closing{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;
  font-size:clamp(23px,4.2vw,36px);color:#eef3fa;max-width:16em;line-height:1.3;text-shadow:0 2px 24px rgba(0,0,0,.8)}
#end .brand{font-size:12px;letter-spacing:.36em;text-transform:uppercase;color:var(--gold);font-weight:600}
.replay{appearance:none;background:transparent;color:var(--mist);border:1px solid rgba(255,255,255,.16);
  border-radius:999px;padding:11px 26px;font-family:Inter,sans-serif;font-size:11.5px;letter-spacing:.2em;
  text-transform:uppercase;font-weight:600;cursor:pointer;transition:color .3s,border-color .3s}
.replay:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.replay:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}

/* controls */
#mute{position:absolute;z-index:25;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  right:calc(16px + env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:999px;
  border:1px solid rgba(255,255,255,.14);background:rgba(8,16,28,.55);color:#cdd8e6;cursor:pointer;
  display:none;align-items:center;justify-content:center}
#mute.show{display:flex}
#mute:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
#prog{position:absolute;left:0;bottom:0;height:2px;width:0;z-index:24;
  background:linear-gradient(90deg,rgba(200,162,68,0),var(--gold-2))}
</style>

<div class="stage">
  <video id="pvid" muted playsinline preload="auto" src="/assets/media/pegasus-no-return.mp4"></video>
  <div class="scrim"></div>
  <div class="wrap"><div id="line" aria-live="polite"></div></div>

  <button id="mute" aria-label="Mute">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
  </button>
  <div id="prog"></div>

  <div id="overlay">
    <div class="eyebrow">Pegasus Capital Network</div>
    <div class="mark">The&nbsp;Constellation<br>of&nbsp;Pegasus</div>
    <div class="sub">A few quiet minutes. Turn the sound on, and let it play.</div>
    <button class="begin" id="begin">Begin</button>
    <div class="note">2:09 · best with sound</div>
  </div>

  <div id="end">
    <div class="dot"></div>
    <div class="closing">Every horizon begins beyond another one.</div>
    <div class="brand">Pegasus Capital Network</div>
    <button class="replay" id="replay">Play again</button>
  </div>
</div>

<audio id="audio" preload="auto" src="/assets/media/pegasus-constellation.mp3"></audio>

<script>
(function(){
  "use strict";
  var DUR = 129.6;
  var LEAD = 0.5; // show each line a touch early so it lands on the word

  var audio = document.getElementById("audio");
  var pvid  = document.getElementById("pvid");
  var line  = document.getElementById("line");
  var overlay = document.getElementById("overlay");
  var endEl = document.getElementById("end");
  var muteBtn = document.getElementById("mute");
  var prog = document.getElementById("prog");

  var beats = [
    [3.6,  "There are truths that live between words."],
    [7.6,  "Not in speeches."],
    [10.0, "Not in headlines."],
    [13.1, "Not in the things people say to be remembered."],
    [17.2, "But in the quiet moments that change us forever."],
    [22.3, "A conversation that arrives at the right time."],
    [26.0, "A hand that stays"],
    [28.9, "when it could have let go."],
    [32.1, "A dream that refuses to disappear."],
    [37.0, "We spend years searching for meaning,"],
    [40.2, "only to discover"],
    [42.7, "that meaning was never hiding."],
    [47.2, "It was growing."],
    [49.1, "<span class='g'>Slowly.</span>"],
    [51.3, "<span class='g'>Silently.</span>"],
    [54.1, "Inside every choice we made."],
    [57.7, "Inside every risk we took."],
    [60.9, "Inside every person who believed in us"],
    [64.6, "before we believed in ourselves."],
    [69.4, "The Constellation of Pegasus"],
    [72.0, "is not a destination."],
    [74.9, "It is a <span class='g'>reminder.</span>"],
    [77.1, "That every horizon"],
    [79.0, "<span class='g'>begins beyond another one.</span>"],
    [82.4, "That every life becomes larger"],
    [85.2, "the moment it begins to serve something greater than itself."],
    [90.5, "And that every flight"],
    [92.3, "begins the same way."],
    [95.2, "With faith."],
    [97.4, "With courage."],
    [99.5, "With a single movement forward."],
    [102.9,"<span class='rise'>We rise.</span>"],
    [105.0,"<span class='rise'>We build.</span>"],
    [106.6,"<span class='rise'>We fly.</span>"],
    [109.0,"Not because the sky belongs to us."],
    [114.2,"But because we choose"],
    [118.4,"to keep reaching for it."]
  ];

  var shown = -1, pending = null;
  function setBeat(i){
    if(i === shown) return;
    shown = i;
    line.classList.remove("show");
    if(pending) clearTimeout(pending);
    pending = setTimeout(function(){ line.innerHTML = beats[i][1]; line.classList.add("show"); }, 300);
  }
  function activeBeat(t){
    var idx = -1;
    for(var i=0;i<beats.length;i++){ if(t >= beats[i][0]) idx = i; else break; }
    return idx;
  }

  var started=false, ended=false;
  function loop(){ if(started && !ended) tick(); requestAnimationFrame(loop); }
  function tick(){
    var t = 0; try{ t = audio.currentTime||0; }catch(e){}
    var i = activeBeat(t + LEAD);
    if(i>=0) setBeat(i);
    prog.style.width = Math.min(100,(t/DUR)*100).toFixed(2)+"%";
    // keep the film locked to the voice
    try{ if(!pvid.paused && Math.abs((pvid.currentTime||0) - t) > 0.3) pvid.currentTime = t; }catch(e){}
    if(!ended && t>0 && (t >= (DUR-0.25) || audio.ended)) showEnd();
  }
  function showEnd(){
    ended = true;
    line.classList.remove("show");
    endEl.classList.add("show");
    try{ pvid.pause(); }catch(e){}
  }

  function begin(){
    if(started && !ended) return;
    ended=false; shown=-1;
    endEl.classList.remove("show");
    overlay.classList.add("gone");
    muteBtn.classList.add("show");
    try{ audio.currentTime = 0; }catch(e){}
    try{ pvid.currentTime = 0; var vp=pvid.play(); if(vp&&vp.catch) vp.catch(function(){}); }catch(e){}
    var pr = audio.play(); if(pr && pr.catch) pr.catch(function(){});
    started = true;
  }

  document.getElementById("begin").addEventListener("click", begin);
  document.getElementById("replay").addEventListener("click", begin);
  muteBtn.addEventListener("click", function(){
    audio.muted = !audio.muted;
    muteBtn.style.opacity = audio.muted ? "0.5" : "1";
  });
  audio.addEventListener("ended", showEnd);
  audio.addEventListener("loadedmetadata", function(){ if(audio.duration && isFinite(audio.duration)) DUR = audio.duration; });

  requestAnimationFrame(loop);
})();
</script>
